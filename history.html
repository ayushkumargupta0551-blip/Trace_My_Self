<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Digital Footprint Detector — discover publicly visible information about your digital identity."
    />
    <title>Scan History | Digital Footprint Detector</title>
    <link rel="stylesheet" href="css/common.css" />
    <style>
      /* History page CSS */

  /* -----------------------------------------
     Filter Row
     ----------------------------------------- */

  .filter-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .filter-row .input,
  .filter-row .select {
    max-width: 220px;
    background: #1c1c1c;
    border-color: #333333;
  }

  .filter-row .input::placeholder {
    color: #777777;
  }

  .filter-row .select option {
    color: #f5f5f5;
    background: #242424;
  }


  /* -----------------------------------------
     History Card
     ----------------------------------------- */

  .main > .card {
    background: #242424;
    border-color: #333333;
  }


  /* -----------------------------------------
     History Table
     ----------------------------------------- */

  .table-wrap {
    border: 1px solid #333333;
    border-radius: 12px;
    overflow-x: auto;
  }

  .data-table {
    background: #1c1c1c;
  }

  .data-table th {
    padding: 15px 16px;
    color: #cccccc;
    background: #202020;
    border-bottom: 1px solid #333333;
    text-align: left;
    font-weight: 600;
  }

  .data-table td {
    padding: 15px 16px;
    color: #999999;
    border-bottom: 1px solid #333333;
  }

  .data-table tbody tr:last-child td {
    border-bottom: none;
  }

  .data-table tbody tr {
    transition: background 0.2s ease;
  }

  .data-table tbody tr:hover {
    background: #242424;
  }

  .data-table strong {
    color: #f5f5f5;
  }


  /* -----------------------------------------
     Risk Badges
     ----------------------------------------- */

  .badge-high {
    color: #ff8b8b;
    background: #351f1f;
    border: 1px solid #5a3030;
  }

  .badge-medium {
    color: #e6bd6b;
    background: #352d1f;
    border: 1px solid #5a4a2d;
  }

  .badge-low {
    color: #79d9a0;
    background: #1d3528;
    border: 1px solid #2d5940;
  }


  /* -----------------------------------------
     History Page Colors
     ----------------------------------------- */

  .main {
    background: #151515;
  }

  .sidebar {
    background: #111111;
    border-right-color: #333333;
  }

  .side-links a {
    color: #999999;
  }

  .side-links a:hover,
  .side-links a.active {
    color: #ffffff;
    background: #242424;
  }

  .app-nav {
    background: #111111;
    border-bottom-color: #333333;
  }

  .app-nav .logo {
    color: #f5f5f5;
  }

  .profile-mini .user-name {
    color: #cccccc;
  }

  .notification {
    color: #999999;
  }

  .page-heading {
    color: #f5f5f5;
  }

    </style>
  </head>
  <body class="">
    <!-- Page content starts here -->

    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="logo" href="dashboard.html"
          ><span class="logo-mark">◈</span> Footprint<span class="logo-accent"
            >Guard</span
          ></a
        >
        <nav class="side-links">
          <a class="" href="dashboard.html"><span>▦</span>Dashboard</a
          ><a class="" href="scan.html"><span>⌕</span>New Scan</a
          ><a class="active" href="history.html"><span>◷</span>History</a
          ><a class="" href="reports.html"><span>▤</span>Reports</a
          ><a class="" href="profile.html"><span>♙</span>Profile</a>
        </nav>
        <div class="side-bottom">
          <a href="#" class="logout-btn" class="logout-btn">↪ Logout</a>
        </div>
      </aside>
      <header class="app-nav">
        <button id="mobileMenu" class="mobile-menu">☰</button>
        <div class="logo">◈ History</div>
        <div class="profile-mini">
          <button class="notification" title="Notifications">♧</button
          ><a href="profile.html">
            <span class="user-name">Ayush Kumar Gupta</span>
            <span class="avatar user-initial">AK</span></a>
        </div>
      </header>
      <main class="main">
        <div class="page-title">
          <div>
            <span class="eyebrow">Your activity</span>
            <h1 class="page-heading">Scan History</h1>
          </div>
          <a class="btn btn-primary" href="scan.html">＋ New Scan</a>
        </div>
        <section class="card">
          <div class="filter-row">
            <input
              class="input"
              placeholder="Search target..."
              id="searchHistory"
            /><select class="select">
              <option>All Types</option>
              <option>Username</option>
              <option>Email</option>
              <option>Website</option>
              <option>Name</option></select
            ><select class="select">
              <option>All Risk Levels</option>
              <option>High</option>
              <option>Medium</option>
              <option>Low</option>
            </select>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Target</th>
                  <th>Type</th>
                  <th>Date</th>
                  <th>Risk</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="historyBody">
                <tr>
                  <td><strong>ayush123</strong></td>
                  <td>Username</td>
                  <td>Aug 11, 2026</td>
                  <td><span class="badge badge-high">High</span></td>
                  <td><a class="helper-link" href="results.html">View</a></td>
                </tr>
                <tr>
                  <td>abc@gmail.com</td>
                  <td>Email</td>
                  <td>Aug 10, 2026</td>
                  <td><span class="badge badge-medium">Medium</span></td>
                  <td><a class="helper-link" href="results.html">View</a></td>
                </tr>
                <tr>
                  <td>example.com</td>
                  <td>Website</td>
                  <td>Aug 08, 2026</td>
                  <td><span class="badge badge-low">Low</span></td>
                  <td><a class="helper-link" href="results.html">View</a></td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <!-- history page js -->
    <script src="js/common.js"></script>
    <script>

      document.addEventListener("DOMContentLoaded", () => {
        const scans = JSON.parse(localStorage.getItem("dfdScans") || "[]");
        const body = $("#historyBody");
        if (scans.length) {
          body.innerHTML = scans
            .map(
              (s) =>
                `<tr><td><strong>${s.target}</strong></td><td>${s.type}</td><td>${s.date}</td><td><span class="badge badge-high">${s.risk || "High"}</span></td><td><a class="helper-link" href="results.html">View</a></td></tr>`,
            )
            .join("");
        }
      });
    </script>
  </body>
</html>
