<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Digital Footprint Detector — discover publicly visible information about your digital identity.">
<title>Create Account | Digital Footprint Detector</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/signup">
</head>
<body class="auth-page">

<!-- Page content starts here -->


<div class="auth-card"><div class="auth-header"><a class="logo" href="index.html"><span class="logo-mark">◈</span> FootprintGuard</a><h1 class="auth-title">Create Account</h1><p>Start monitoring your public digital footprint.</p></div>
<form id="signupForm" novalidate><div class="form-group"><label for="name">Name</label><input class="input" id="name" placeholder="Your full name"></div>
<div class="form-group"><label for="email">Email</label><input class="input" id="email" type="email" placeholder="you@example.com"></div>
<div class="form-group"><label for="password">Password</label><div class="input-wrap"><input class="input" id="password" type="password" placeholder="Create a strong password"><button type="button" class="password-toggle" data-target="password">Show</button></div><div class="strength"><div class="strength-bars"><span></span><span></span><span></span><span></span></div><div class="strength-text" id="strengthText">Very weak</div></div></div>
<div class="form-group"><label for="confirmPassword">Confirm Password</label><div class="input-wrap"><input class="input" id="confirmPassword" type="password" placeholder="Repeat your password"><button type="button" class="password-toggle" data-target="confirmPassword">Show</button></div></div>
<label class="checkbox"><input id="terms" type="checkbox"> <span>I agree to the <a class="helper-link" href="#">Terms</a> &amp; <a class="helper-link" href="#">Privacy Policy</a>.</span></label>
<div class="error" id="signupError" class="signup-error"></div><button class="btn btn-primary btn-block" type="submit">Create Account</button></form>
<div class="auth-footer">Already have an account? <a class="helper-link" href="login.html">Login</a></div></div>
<script src="js/common.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
