<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Digital Footprint Detector — discover publicly visible information about your digital identity."
    />
    <title>My Profile | Digital Footprint Detector</title>
    <style>
    /* =========================================================
   PROFILE PAGE CSS
   ========================================================= */


/* ---------------------------------------------------------
   CSS Variables
   --------------------------------------------------------- */

:root {
  --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  --radius: 16px;
}


/* ---------------------------------------------------------
   Reset
   --------------------------------------------------------- */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
}


/* ---------------------------------------------------------
   App Shell
   --------------------------------------------------------- */

.app-shell {
  min-height: 100vh;

  display: grid;

  grid-template-columns: 240px 1fr;
  grid-template-rows: 70px 1fr;
}


/* ---------------------------------------------------------
   Sidebar
   --------------------------------------------------------- */

.sidebar {
  grid-row: 1 / 3;

  display: flex;
  flex-direction: column;

  padding: 20px 14px;

  background: #111111;

  border-right: 1px solid #333333;
}


/* ---------------------------------------------------------
   Logo
   --------------------------------------------------------- */

.logo {
  display: flex;
  align-items: center;

  gap: 8px;

  color: #f5f5f5;

  font-weight: 700;
  font-size: 1.1rem;

  text-decoration: none;
}

.logo-mark {
  width: 36px;
  height: 36px;

  display: grid;
  place-items: center;

  color: #ffffff;

  background: linear-gradient(
    135deg,
    #4f8cff,
    #7b61ff
  );

  border-radius: 11px;
}

.logo-accent {
  color: #4f8cff;
}


/* ---------------------------------------------------------
   Sidebar Links
   --------------------------------------------------------- */

.side-links {
  display: flex;
  flex-direction: column;

  gap: 6px;

  margin-top: 30px;
}

.side-links a {
  display: flex;
  align-items: center;

  gap: 12px;

  padding: 11px 12px;

  color: #999999;

  border-radius: 10px;

  text-decoration: none;

  transition: 0.2s ease;
}

.side-links a:hover {
  color: #f5f5f5;

  background: #242424;
}

.side-links a.active {
  color: #ffffff;

  background: #242424;
}


/* ---------------------------------------------------------
   Sidebar Bottom
   --------------------------------------------------------- */

.side-bottom {
  margin-top: auto;
}

.logout-btn {
  display: block;

  padding: 11px 12px;

  color: #999999;

  border-radius: 10px;

  text-decoration: none;

  transition: 0.2s ease;
}

.logout-btn:hover {
  color: #f5f5f5;

  background: #242424;
}


/* ---------------------------------------------------------
   Top Navigation
   --------------------------------------------------------- */

.app-nav {
  grid-column: 2;

  min-height: 74px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 28px;

  background: #111111;

  border-bottom: 1px solid #303030;
}

.app-nav > .logo {
  display: flex;
  align-items: center;

  gap: 8px;

  margin: 0;

  color: #f5f5f5;

  font-size: 1.2rem;
  font-weight: 600;

  text-decoration: none;
}


/* ---------------------------------------------------------
   Mobile Menu
   --------------------------------------------------------- */

.app-nav > .mobile-menu {
  display: none;

  color: #f5f5f5;

  background: transparent;

  border: none;

  font-size: 1.4rem;

  cursor: pointer;
}


/* ---------------------------------------------------------
   Profile Mini
   --------------------------------------------------------- */

.profile-mini {
  display: flex;
  align-items: center;

  gap: 12px;

  margin-left: auto;
}

.profile-mini > a {
  display: flex;
  align-items: center;

  gap: 10px;

  color: #f5f5f5;

  text-decoration: none;
}


/* ---------------------------------------------------------
   Notification
   --------------------------------------------------------- */

.notification {
  width: 44px;
  height: 44px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;

  color: #9aa0aa;

  background: #181818;

  border: 1px solid #333333;

  border-radius: 10px;

  font-size: 1rem;

  cursor: pointer;

  transition: all 0.2s ease;
}

.notification:hover {
  color: #f5f5f5;

  background: #202020;

  border-color: #555555;
}


/* ---------------------------------------------------------
   User Name
   --------------------------------------------------------- */

.profile-mini .user-name {
  color: #e8e8e8;

  font-size: 0.9rem;
  font-weight: 500;

  white-space: nowrap;
}


/* ---------------------------------------------------------
   Mini Avatar
   --------------------------------------------------------- */

.profile-mini .avatar {
  width: 44px;
  height: 44px;

  display: flex;
  align-items: center;
  justify-content: center;

  flex-shrink: 0;

  border-radius: 50%;

  background: #4f7ff5;

  color: #ffffff;

  font-size: 0.9rem;
  font-weight: 600;
}


/* ---------------------------------------------------------
   Main
   --------------------------------------------------------- */

.main {
  grid-column: 2;

  min-width: 0;

  padding: 30px;

  background: #151515;

  color: #f5f5f5;
}


/* ---------------------------------------------------------
   Page Title
   --------------------------------------------------------- */

.page-title {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 20px;

  margin-bottom: 25px;
}

.eyebrow {
  color: #4f8cff;

  font-size: 0.8rem;
  font-weight: 600;

  text-transform: uppercase;
}

.page-heading {
  margin: 5px 0 0;

  color: #f5f5f5;
}


/* ---------------------------------------------------------
   Buttons
   --------------------------------------------------------- */

.btn {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  gap: 8px;

  padding: 11px 17px;

  color: #ffffff;

  border: 0;

  border-radius: 12px;

  font-weight: 700;

  text-decoration: none;

  cursor: pointer;

  transition: 0.2s ease;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn-primary {
  color: #ffffff;

  background: #4f8cff;

  border: 1px solid #4f8cff;
}

.btn-secondary {
  color: #cccccc;

  background: #242424;

  border: 1px solid #3a3a3a;
}

.btn-secondary:hover {
  color: #ffffff;

  background: #303030;
}


/* ---------------------------------------------------------
   Profile Grid
   --------------------------------------------------------- */

.profile-grid-layout {
  display: grid;

  grid-template-columns:
    minmax(0, 1.15fr)
    minmax(0, 0.85fr);

  gap: 24px;

  align-items: start;
}


/* ---------------------------------------------------------
   Profile Cards
   --------------------------------------------------------- */

.profile-grid-layout .card {
  background: #171717;

  border: 1px solid #353535;

  border-radius: 14px;

  box-shadow: none;

  overflow: hidden;
}


/* ---------------------------------------------------------
   Profile Cover
   --------------------------------------------------------- */

.profile-cover {
  min-height: 170px;

  display: flex;
  align-items: center;
  justify-content: center;

  margin: 0 0 28px;

  background: #141414;

  border-bottom: 1px solid #303030;
}


/* ---------------------------------------------------------
   Profile Avatar
   --------------------------------------------------------- */

.profile-avatar {
  width: 92px;
  height: 92px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: #4f7ff5;

  color: #ffffff;

  font-size: 1.6rem;
  font-weight: 600;

  border: 4px solid #171717;

  box-shadow: 0 0 0 1px #3d3d3d;
}


/* ---------------------------------------------------------
   Profile Form
   --------------------------------------------------------- */

#profileForm {
  padding: 0 28px 28px;
}


/* Labels */

#profileForm label {
  display: block;

  margin-bottom: 8px;

  color: #eeeeee;

  font-size: 0.9rem;
  font-weight: 500;
}


/* Form Groups */

#profileForm .form-group {
  margin-bottom: 20px;
}


/* Inputs */

#profileForm .input {
  width: 100%;

  min-height: 46px;

  padding: 11px 13px;

  color: #f2f2f2;

  background: #111111;

  border: 1px solid #363636;

  border-radius: 9px;

  outline: none;

  transition: all 0.2s ease;
}

#profileForm .input::placeholder {
  color: #6f6f6f;
}

#profileForm .input:focus {
  border-color: #4f8cff;

  box-shadow:
    0 0 0 3px rgba(79, 140, 255, 0.1);
}


/* Save Button */

#profileForm .btn-primary {
  margin-top: 2px;
}


/* ---------------------------------------------------------
   Security Card
   --------------------------------------------------------- */

.profile-grid-layout > .card:nth-child(2) {
  padding: 28px;
}


/* Security Heading */

.profile-grid-layout > .card:nth-child(2) h2 {
  margin: 0 0 8px;

  color: #f5f5f5;

  font-size: 1.25rem;
}


/* ---------------------------------------------------------
   Security Rows
   --------------------------------------------------------- */

.security-row {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 20px;

  padding: 21px 0;

  border-bottom: 1px solid #303030;
}

.security-row:last-child {
  padding-bottom: 0;

  border-bottom: none;
}


/* Security Title */

.security-row b {
  display: block;

  color: #eeeeee;

  font-size: 0.95rem;
  font-weight: 500;
}


/* Security Description */

.security-row p {
  margin: 6px 0 0;

  color: #858585;

  font-size: 0.84rem;

  line-height: 1.5;
}


/* Security Buttons */

.security-row .btn {
  flex-shrink: 0;

  white-space: nowrap;
}


/* ---------------------------------------------------------
   Small Muted Text
   --------------------------------------------------------- */

.small-muted {
  color: #858585;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */


/* ---------------------------------------------------------
   Tablet
   --------------------------------------------------------- */

@media (max-width: 900px) {

  .profile-grid-layout {
    grid-template-columns: 1fr;
  }

}


/* ---------------------------------------------------------
   Small Tablet
   --------------------------------------------------------- */

@media (max-width: 700px) {

  .app-shell {
    grid-template-columns: 1fr;

    grid-template-rows: 70px 1fr;
  }

  .sidebar {
    display: none;
  }

  .app-nav {
    grid-column: 1;

    padding: 0 18px;
  }

  .main {
    grid-column: 1;

    padding: 25px;
  }

  .app-nav > .mobile-menu {
    display: block;
  }

  .profile-mini .user-name {
    display: none;
  }

  .profile-grid-layout {
    gap: 18px;
  }

}


/* ---------------------------------------------------------
   Mobile
   --------------------------------------------------------- */

@media (max-width: 600px) {

  .app-nav {
    min-height: 64px;

    padding: 0 14px;
  }

  .app-nav > .logo {
    font-size: 1rem;
  }

  .profile-mini {
    gap: 8px;
  }

  .notification {
    width: 40px;
    height: 40px;
  }

  .profile-mini .avatar {
    width: 40px;
    height: 40px;
  }


  /* Profile Card */

  .profile-grid-layout .card {
    border-radius: 12px;
  }


  /* Cover */

  .profile-cover {
    min-height: 140px;

    margin-bottom: 22px;
  }

  .profile-avatar {
    width: 78px;
    height: 78px;

    font-size: 1.35rem;
  }


  /* Form */

  #profileForm {
    padding: 0 20px 22px;
  }


  /* Security */

  .profile-grid-layout > .card:nth-child(2) {
    padding: 22px 20px;
  }

  .security-row {
    align-items: flex-start;

    flex-direction: column;

    gap: 13px;

    padding: 18px 0;
  }

  .security-row .btn {
    width: 100%;
  }

}


/* ---------------------------------------------------------
   Small Mobile
   --------------------------------------------------------- */

@media (max-width: 400px) {

  .main {
    padding: 15px;
  }

  .app-nav {
    padding: 0 10px;
  }

  .app-nav > .logo {
    font-size: 0.9rem;
  }

  .notification {
    display: none;
  }

  .profile-mini .avatar {
    width: 38px;
    height: 38px;
  }

  .profile-cover {
    min-height: 125px;
  }

  #profileForm {
    padding: 0 16px 20px;
  }

  .profile-grid-layout > .card:nth-child(2) {
    padding: 20px 16px;
  }

}
</style>
  </head>

  <body class="">
    <!-- Page content starts here -->

    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="logo" href="dashboard.html"
          ><span class="logo-mark">◈</span> Footprint<span class="logo-accent"
            >Guard</span
          ></a
        >
        <nav class="side-links">
          <a class="" href="dashboard.html"><span>▦</span>Dashboard</a
          ><a class="" href="scan.html"><span>⌕</span>New Scan</a
          ><a class="" href="history.html"><span>◷</span>History</a
          ><a class="" href="reports.html"><span>▤</span>Reports</a
          ><a class="active" href="profile.html"><span>♙</span>Profile</a>
        </nav>
        <div class="side-bottom">
          <a href="#" class="logout-btn" class="logout-btn">↪ Logout</a>
        </div>
      </aside>
      <header class="app-nav">
        <button id="mobileMenu" class="mobile-menu">☰</button>
        <div class="logo">◈ Profile</div>
        <div class="profile-mini">
          <button class="notification" title="Notifications">♧</button
          ><a href="profile.html"
            ><span class="user-name">Ayush Kumar Gupta</span>
            <span class="avatar user-initial">AK</span></a
          >
        </div>
      </header>
      <main class="main">
        <div class="page-title">
          <div>
            <span class="eyebrow">Account</span>
            <h1 class="page-heading">My Profile</h1>
          </div>
        </div>
        <div class="profile-grid-layout">
          <section class="card">
            <div class="profile-cover">
              <div class="profile-avatar user-initial">AK</div>
            </div>
            <form id="profileForm">
              <div class="form-group">
                <label for="profileName">Name</label
                ><input
                  class="input"
                  id="profileName"
                  value="Ayush Kumar Gupta"
                />
              </div>
              <div class="form-group">
                <label for="profileEmail">Email</label
                ><input
                  class="input"
                  id="profileEmail"
                  value="example@gmail.com"
                />
              </div>
              <button class="btn btn-primary" type="submit">
                Save Changes
              </button>
            </form>
          </section>
          <section class="card">
            <h2>Security</h2>
            <div class="security-row">
              <div>
                <b>Password</b>
                <p class="small-muted">••••••••</p>
              </div>
              <button class="btn btn-secondary">Change Password</button>
            </div>
            <div class="security-row">
              <div>
                <b>Two-factor authentication</b>
                <p class="small-muted">
                  Add an extra layer of account security.
                </p>
              </div>
              <button class="btn btn-secondary">Enable</button>
            </div>
            <div class="security-row">
              <div>
                <b>Active sessions</b>
                <p class="small-muted">1 current browser session</p>
              </div>
              <button class="btn btn-secondary">Manage</button>
            </div>
          </section>
        </div>
      </main>
    </div>
    <!-- Profile page JS -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        $("#profileForm").addEventListener("submit", (e) => {
          e.preventDefault();
          const name = $("#profileName").value.trim(),
            email = $("#profileEmail").value.trim();
          if (name && email) {
            localStorage.setItem("dfdUser", JSON.stringify({ name, email }));
            applyUser();
            showToast("Profile updated successfully.");
          }
        });
      });
    </script>
  </body>
