<html lang="en">
  <head>

    <style>
    /* =========================================================
   HISTORY PAGE CSS
   ========================================================= */


/* ---------------------------------------------------------
   CSS Variables
   --------------------------------------------------------- */

:root {
  --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  --radius: 16px;
}


/* ---------------------------------------------------------
   Reset
   --------------------------------------------------------- */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
}


/* ---------------------------------------------------------
   App Shell
   --------------------------------------------------------- */

.app-shell {
  min-height: 100vh;

  display: grid;

  grid-template-columns: 240px 1fr;
  grid-template-rows: 70px 1fr;
}


/* ---------------------------------------------------------
   Sidebar
   --------------------------------------------------------- */

.sidebar {
  grid-row: 1 / 3;

  display: flex;
  flex-direction: column;

  padding: 20px 14px;

  background: #111111;

  border-right: 1px solid #333333;
}


/* ---------------------------------------------------------
   Logo
   --------------------------------------------------------- */

.logo {
  display: flex;
  align-items: center;

  gap: 8px;

  color: #f5f5f5;

  font-weight: 700;
  font-size: 1.1rem;

  text-decoration: none;
}

.logo-mark {
  width: 36px;
  height: 36px;

  display: grid;
  place-items: center;

  color: #ffffff;

  background: linear-gradient(
    135deg,
    #4f8cff,
    #7b61ff
  );

  border-radius: 11px;
}

.logo-accent {
  color: #4f8cff;
}


/* ---------------------------------------------------------
   Sidebar Links
   --------------------------------------------------------- */

.side-links {
  display: flex;
  flex-direction: column;

  gap: 6px;

  margin-top: 30px;
}

.side-links a {
  display: flex;
  align-items: center;

  gap: 12px;

  padding: 11px 12px;

  color: #999999;

  border-radius: 10px;

  text-decoration: none;

  transition: 0.2s ease;
}

.side-links a:hover {
  color: #f5f5f5;

  background: #242424;
}

.side-links a.active {
  color: #ffffff;

  background: #242424;
}


/* ---------------------------------------------------------
   Sidebar Bottom
   --------------------------------------------------------- */

.side-bottom {
  margin-top: auto;
}

.logout-btn {
  display: block;

  padding: 11px 12px;

  color: #999999;

  border-radius: 10px;

  text-decoration: none;

  transition: 0.2s ease;
}

.logout-btn:hover {
  color: #f5f5f5;

  background: #242424;
}


/* ---------------------------------------------------------
   Top Navigation
   --------------------------------------------------------- */

.app-nav {
  grid-column: 2;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 28px;

  background: #111111;

  border-bottom: 1px solid #333333;
}

.app-nav .logo {
  color: #f5f5f5;
}


/* ---------------------------------------------------------
   Mobile Menu
   --------------------------------------------------------- */

.mobile-menu {
  display: none;

  color: #f5f5f5;

  background: transparent;

  border: none;

  font-size: 1.4rem;

  cursor: pointer;
}


/* ---------------------------------------------------------
   Profile Mini
   --------------------------------------------------------- */

.profile-mini {
  display: flex;
  align-items: center;

  gap: 12px;
}

.profile-mini a {
  display: flex;
  align-items: center;

  gap: 10px;

  text-decoration: none;
}

.profile-mini .user-name {
  color: #cccccc;
}

.notification {
  color: #999999;

  background: transparent;

  border: none;

  font-size: 1.2rem;

  cursor: pointer;
}

.avatar {
  width: 36px;
  height: 36px;

  display: grid;
  place-items: center;

  color: #ffffff;

  background: #303030;

  border-radius: 50%;
}


/* ---------------------------------------------------------
   Main
   --------------------------------------------------------- */

.main {
  grid-column: 2;

  min-width: 0;

  padding: 30px;

  background: #151515;

  color: #f5f5f5;
}


/* ---------------------------------------------------------
   Page Title
   --------------------------------------------------------- */

.page-title {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 20px;

  margin-bottom: 25px;
}

.eyebrow {
  color: #4f8cff;

  font-size: 0.8rem;
  font-weight: 600;

  text-transform: uppercase;
}

.page-heading {
  margin: 5px 0 0;

  color: #f5f5f5;
}


/* ---------------------------------------------------------
   Buttons
   --------------------------------------------------------- */

.btn {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  gap: 8px;

  padding: 11px 17px;

  color: #ffffff;

  border: 0;

  border-radius: 12px;

  font-weight: 700;

  text-decoration: none;

  cursor: pointer;

  transition: 0.2s ease;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn-primary {
  color: #ffffff;

  background: #4f8cff;

  border: 1px solid #4f8cff;
}


/* ---------------------------------------------------------
   Card
   --------------------------------------------------------- */

.card {
  padding: 22px;

  background: #242424;

  border: 1px solid #333333;

  border-radius: var(--radius);

  box-shadow: var(--shadow);
}


/* ---------------------------------------------------------
   Filter Row
   --------------------------------------------------------- */

.filter-row {
  display: flex;

  gap: 10px;

  flex-wrap: wrap;

  margin-bottom: 18px;
}

.filter-row .input,
.filter-row .select {
  width: 100%;

  max-width: 220px;

  padding: 12px 14px;

  color: #f5f5f5;

  background: #1c1c1c;

  border: 1px solid #333333;

  border-radius: 10px;

  outline: none;
}

.filter-row .input::placeholder {
  color: #777777;
}

.filter-row .input:focus,
.filter-row .select:focus {
  border-color: #4f8cff;

  box-shadow:
    0 0 0 3px rgba(79, 140, 255, 0.12);
}

.filter-row .select option {
  color: #f5f5f5;

  background: #242424;
}


/* ---------------------------------------------------------
   History Table
   --------------------------------------------------------- */

.table-wrap {
  border: 1px solid #333333;

  border-radius: 12px;

  overflow-x: auto;
}

.data-table {
  width: 100%;

  border-collapse: collapse;

  background: #1c1c1c;
}

.data-table th {
  padding: 15px 16px;

  color: #cccccc;

  background: #202020;

  border-bottom: 1px solid #333333;

  text-align: left;

  font-weight: 600;
}

.data-table td {
  padding: 15px 16px;

  color: #999999;

  border-bottom: 1px solid #333333;
}

.data-table tbody tr {
  transition: background 0.2s ease;
}

.data-table tbody tr:hover {
  background: #242424;
}

.data-table tbody tr:last-child td {
  border-bottom: none;
}

.data-table strong {
  color: #f5f5f5;
}


/* ---------------------------------------------------------
   Risk Badges
   --------------------------------------------------------- */

.badge {
  display: inline-block;

  padding: 5px 10px;

  border-radius: 20px;

  font-size: 0.8rem;

  font-weight: 600;
}

.badge-high {
  color: #ff8b8b;

  background: #351f1f;

  border: 1px solid #5a3030;
}

.badge-medium {
  color: #e6bd6b;

  background: #352d1f;

  border: 1px solid #5a4a2d;
}

.badge-low {
  color: #79d9a0;

  background: #1d3528;

  border: 1px solid #2d5940;
}


/* ---------------------------------------------------------
   View Link
   --------------------------------------------------------- */

.helper-link {
  color: #4f8cff;

  text-decoration: none;

  transition: 0.2s ease;
}

.helper-link:hover {
  color: #7b61ff;
}


/* ---------------------------------------------------------
   Tablet
   --------------------------------------------------------- */

@media (max-width: 900px) {

  .app-shell {
    grid-template-columns: 200px 1fr;
  }

  .main {
    padding: 25px;
  }

  .app-nav {
    padding: 0 20px;
  }
}


/* ---------------------------------------------------------
   Mobile
   --------------------------------------------------------- */

@media (max-width: 700px) {

  .app-shell {
    grid-template-columns: 1fr;

    grid-template-rows: 65px 1fr;
  }

  .sidebar {
    display: none;
  }

  .app-nav {
    grid-column: 1;

    padding: 0 18px;
  }

  .main {
    grid-column: 1;

    padding: 20px;
  }

  .mobile-menu {
    display: block;
  }

  .page-title {
    align-items: flex-start;

    flex-direction: column;
  }

  .profile-mini .user-name {
    display: none;
  }

  .filter-row {
    flex-direction: column;
  }

  .filter-row .input,
  .filter-row .select {
    max-width: none;
  }
}


/* ---------------------------------------------------------
   Small Mobile
   --------------------------------------------------------- */

@media (max-width: 500px) {

  .main {
    padding: 15px;
  }

  .card {
    padding: 16px;
  }

  .page-title .btn {
    width: 100%;
  }

  .table-wrap {
    overflow-x: auto;
  }

  .data-table {
    min-width: 650px;
  }
}
</style>

    <!-- history page js -->
    <script>

      document.addEventListener("DOMContentLoaded", () => {
        const scans = JSON.parse(localStorage.getItem("dfdScans") || "[]");
        const body = $("#historyBody");
        if (scans.length) {
          body.innerHTML = scans
            .map(
              (s) =>
                `<tr><td><strong>${s.target}</strong></td><td>${s.type}</td><td>${s.date}</td><td><span class="badge badge-high">${s.risk || "High"}</span></td><td><a class="helper-link" href="results.html">View</a></td></tr>`,
            )
            .join("");
        }
      });
