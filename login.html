<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Digital Footprint Detector — discover publicly visible information about your digital identity."
    />
    <title>Login | Digital Footprint Detector</title>
    <link rel="stylesheet" href="css/common.css" />
    <style>
      /* Login page CSS */

  /* -----------------------------------------
     Auth Page Background
     ----------------------------------------- */

  .auth-page {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 20px;

    background: #151515;
  }


  /* -----------------------------------------
     Login Card
     ----------------------------------------- */

  .auth-card {
    width: 100%;
    max-width: 450px;

    padding: 32px;

    background: #242424;

    border: 1px solid #333333;
    border-radius: 18px;

    box-shadow: var(--shadow);
  }


  /* -----------------------------------------
     Header
     ----------------------------------------- */

  .auth-header {
    text-align: center;

    margin-bottom: 28px;
  }

  .auth-header .logo {
    display: inline-flex;

    margin-bottom: 24px;

    color: #f5f5f5;

    text-decoration: none;
  }

  .auth-title {
    margin-bottom: 8px;

    color: #f5f5f5;

    font-size: 2rem;
  }

  .auth-header p {
    color: #999999;

    font-size: 0.9rem;
  }


  /* -----------------------------------------
     Form Groups
     ----------------------------------------- */

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;

    margin-bottom: 8px;

    color: #f5f5f5;

    font-weight: 500;
  }


  /* -----------------------------------------
     Input
     ----------------------------------------- */

  .input {
    width: 100%;

    padding: 13px 14px;

    color: #f5f5f5;

    background: #1c1c1c;

    border: 1px solid #333333;
    border-radius: 10px;

    outline: none;

    transition: 0.2s ease;
  }

  .input::placeholder {
    color: #777777;
  }

  .input:focus {
    border-color: #4f8cff;

    box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.12);
  }


  /* -----------------------------------------
     Password Field
     ----------------------------------------- */

  .input-wrap {
    position: relative;
  }

  .input-wrap .input {
    padding-right: 65px;
  }

  .password-toggle {
    position: absolute;

    top: 50%;
    right: 12px;

    transform: translateY(-50%);

    padding: 5px;

    color: #4f8cff;

    background: transparent;

    border: none;

    cursor: pointer;
  }

  .password-toggle:hover {
    color: #7b61ff;
  }


  /* -----------------------------------------
     Remember Me + Forgot Password
     ----------------------------------------- */

  .form-row {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;

    margin-bottom: 22px;
  }

  .remember {
    display: flex;

    align-items: center;

    gap: 8px;

    color: #999999;

    font-size: 0.85rem;

    cursor: pointer;
  }

  .remember input {
    accent-color: #4f8cff;
  }

  .helper-link {
    color: #4f8cff;

    text-decoration: none;

    transition: 0.2s ease;
  }

  .helper-link:hover {
    color: #7b61ff;
  }


  /* -----------------------------------------
     Login Button
     ----------------------------------------- */

  .auth-card .btn-block {
    width: 100%;
  }


  /* -----------------------------------------
     Loading
     ----------------------------------------- */

  .loading {
    display: none;

    align-items: center;
    justify-content: center;

    gap: 8px;

    margin-top: 16px;

    color: #999999;

    font-size: 0.9rem;
  }

  .spinner {
    width: 16px;
    height: 16px;

    border: 2px solid #333333;
    border-top-color: #4f8cff;

    border-radius: 50%;

    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }


  /* -----------------------------------------
     Error Message
     ----------------------------------------- */

  .error {
    margin-top: 8px;

    color: #ff7b7b;

    font-size: 0.85rem;
  }


  /* -----------------------------------------
     Auth Footer
     ----------------------------------------- */

  .auth-footer {
    text-align: center;

    margin-top: 18px;

    color: #999999;

    font-size: 0.88rem;
  }

  .auth-footer a {
    color: #4f8cff;

    text-decoration: none;
  }

  .auth-footer a:hover {
    color: #7b61ff;
  }


  /* -----------------------------------------
     Tablet
     ----------------------------------------- */

  @media (max-width: 600px) {

    .auth-page {
      padding: 20px 15px;
    }

    .auth-card {
      padding: 26px 22px;
    }

    .auth-title {
      font-size: 1.8rem;
    }

  }


  /* -----------------------------------------
     Small Mobile
     ----------------------------------------- */

  @media (max-width: 400px) {

    .auth-page {
      padding: 15px 10px;
    }

    .auth-card {
      padding: 22px 18px;

      border-radius: 14px;
    }

    .auth-title {
      font-size: 1.6rem;
    }

    .form-row {
      align-items: flex-start;

      flex-direction: column;

      gap: 10px;
    }

    .auth-footer {
      font-size: 0.82rem;
    }

  }
    </style>
  </head>

  <body class="auth-page">
    <!-- Page content starts here -->

    <div class="auth-card">
      <div class="auth-header">
        <a class="logo" href="index.html"
          ><span class="logo-mark">◈</span> FootprintGuard</a
        >
        <h1 class="auth-title">Welcome Back</h1>
        <p>Sign in to access your scans and reports.</p>
      </div>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label
          ><input
            class="input"
            id="email"
            type="email"
            placeholder="you@example.com"
          />
          <div class="error" id="emailError"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input
              class="input"
              id="password"
              type="password"
              placeholder="Enter your password"
            /><button
              type="button"
              class="password-toggle"
              data-target="password"
            >
              Show
            </button>
          </div>
        </div>
        <div class="form-row" class="auth-row">
          <label class="remember"><input type="checkbox" /> Remember me</label
          ><a class="helper-link" href="#">Forgot Password?</a>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Login</button>
        <div class="loading" id="loginLoading">
          <span class="spinner"></span> Signing you in...
        </div>
        <div class="error" id="loginError"></div>
      </form>
      <div class="auth-footer">
        Don't have an account?
        <a class="helper-link" href="signup.html">Create Account</a>
      </div>
      <div class="auth-footer"><a href="index.html">← Back to home</a></div>
    </div>
         <!-- Login page JS  -->
    <script src="js/common.js"></script>
    <script>

      document.addEventListener("DOMContentLoaded", () => {
        const form = $("#loginForm"),
          error = $("#loginError"),
          loading = $("#loginLoading");
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          error.style.display = "none";
          const email = $("#email").value.trim(),
            pass = $("#password").value;
          if (!email || !email.includes("@")) {
            error.textContent = "Please enter a valid email address.";
            error.style.display = "block";
            return;
          }
          if (pass.length < 6) {
            error.textContent = "Password must contain at least 6 characters.";
            error.style.display = "block";
            return;
          }
          loading.style.display = "flex";
          setTimeout(() => {
            localStorage.setItem(
              "dfdUser",
              JSON.stringify({ name: "Ayush Kumar Gupta", email }),
            );
            location.href = "dashboard.html";
          }, 900);
        });
      });
    </script>
  </body>
</html>
